<style>
*{box-sizing:border-box}

body{

.products{

}

.card{

border-radius:14px;

.card img{

height:145px;
object-fit:contain;
border-radius:10px;
background:#fafafa
}

.card h3{

margin:8px 0 4px
}

.price{

.mrp{

.deal{

.stock{

.out{

.card button,
.primary{

footer{

color:#fff;

.modal{

position:fixed;

.box select,

padding:12px;
margin:7px 0;

.box textarea{

.close{
float:right;
background:none;
border:0;
font-size:25px

.row{

.adminitem{

}

.danger{

}

.green{

color:#fff

.orange{
background:#ef6c00;
color:#fff
}

.cartrow{

justify-content:space-between;
border-bottom:1px solid #ddd;
padding:10px 0;
gap:10px
}

.qtybtn{

background:#fff;
border-radius:5px;
padding:3px 8px
}

.badge{
background:#e53935;
color:#fff;

padding:2px 7px;
font-size:11px
}

.notice{

border:1px solid #ffe08a;
padding:10px;
border-radius:8px;
font-size:13px;

}

.success{
background:#e8f5e9;
border:1px solid #a5d6a7;
padding:10px;
border-radius:8px;

margin:10px 0
}

.preview{
width:100%;
max-height:180px;
object-fit:contain;

}

.orderbox{

}

.orderstatus{

hr{

@media(min-width:700px){

</style>
</head>

<header>

<div class="top">

<div>

<script>

/* =========================
DEFAULT PRODUCTS
========================= */

const defaultProducts=[

{
id:1,
name:"Vanilla",
cat:"Cups",
mrp:40,
price:35,
stock:20,
img:"https://via.placeholder.com/300?text=Vanilla"
},

{
id:2,
name:"Chocolate",
cat:"Cups",
mrp:45,
price:40,
stock:20,
img:"https://via.placeholder.com/300?text=Chocolate"
},

{
id:3,
name:"Strawberry",
cat:"Cups",
mrp:45,
price:40,
stock:20,
img:"https://via.placeholder.com/300?text=Strawberry"
},

{
id:4,
name:"Butterscotch",
cat:"Cups",
mrp:50,
price:45,
stock:20,
img:"https://via.placeholder.com/300?text=Butterscotch"
},

{
id:5,
name:"Chocobar",
cat:"Bars",
mrp:35,
price:30,
stock:20,
img:"https://via.placeholder.com/300?text=Chocobar"
},

{
id:6,
name:"Grape Bar",
cat:"Bars",
mrp:35,
price:30,
stock:20,
img:"https://via.placeholder.com/300?text=Grape+Bar"
},

{
id:7,
name:"Mango",
cat:"Bars",
mrp:35,
price:30,
stock:20,
img:"https://via.placeholder.com/300?text=Mango"
},

{
id:8,
name:"Family Pack",
cat:"Family Packs",
mrp:200,
price:180,
stock:20,
img:"https://via.placeholder.com/300?text=Family+Pack"
}

];


/* =========================
LOCAL STORAGE
========================= */

let products=
JSON.parse(localStorage.getItem("products")||"null")
||defaultProducts;

let categories=
JSON.parse(localStorage.getItem("categories")||"null")
||["All","Cups","Bars","Family Packs"];

let cart=
JSON.parse(localStorage.getItem("cart")||"[]");

let wishlist=
JSON.parse(localStorage.getItem("wishlist")||"[]");

let orders=
JSON.parse(localStorage.getItem("orders")||"[]");

let banner=
localStorage.getItem("bannerImage")||"";

let selectedCat="All";


/* =========================
SAVE
========================= */

function save(){

localStorage.setItem(
"products",
JSON.stringify(products)
);

localStorage.setItem(
"categories",
JSON.stringify(categories)
);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

localStorage.setItem(
"wishlist",
JSON.stringify(wishlist)
);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

}


/* =========================
BANNER
========================= */

function renderBanner(){

let hero=document.querySelector(".hero");

if(banner){

hero.style.backgroundImage=
"url('"+banner+"')";

hero.style.backgroundSize="cover";
hero.style.backgroundPosition="center";

}

}


/* =========================
CATEGORIES
========================= */

function renderCategories(){

let el=document.getElementById("categories");

el.innerHTML=
categories.map(c=>`

<button
class="${c==selectedCat?'active':''}"
onclick="selectCat('${escapeText(c)}')">

${escapeHTML(c)}

</button>

`).join("");

}


function selectCat(c){

selectedCat=c;

renderCategories();

renderProducts();

}


/* =========================
PRODUCTS
========================= */

function renderProducts(){

let q=
document.getElementById("search")
.value
.toLowerCase();

let list=
products.filter(p=>

(selectedCat=="All"||p.cat==selectedCat)

&&

p.name.toLowerCase().includes(q)

);


document.getElementById("productCount")
.textContent=list.length+" products";


document.getElementById("products").innerHTML=

list.map(p=>`

<div class="card">

<img src="${p.img}"
alt="${escapeHTML(p.name)}">

<h3>${escapeHTML(p.name)}</h3>

<div class="small">
${escapeHTML(p.cat)}
</div>

<div>
<span class="mrp">₹${p.mrp||p.price}</span>
<span class="deal">₹${p.price}</span>
</div>

<div class="${Number(p.stock)<=0?'stock out':'stock'}">

${
Number(p.stock)<=0
?"Out of Stock"
:"Stock: "+p.stock
}

</div>

<button
${Number(p.stock)<=0?"disabled":""}
onclick="addCart(${p.id})">

${
Number(p.stock)<=0
?"Out of Stock"
:"Add to Cart"
}

</button>

<button
style="background:#eee;color:#222"
onclick="toggleWish(${p.id})">

${wishlist.includes(p.id)?"❤️":"♡"} Wishlist

</button>

</div>

`).join("");

}


/* =========================
CART
========================= */

function addCart(id){

let p=products.find(x=>x.id==id);

if(!p||Number(p.stock)<=0){

alert("Product is out of stock.");

return;

}

let item=cart.find(x=>x.id==id);

if(item){

if(item.qty>=Number(p.stock)){

alert("Stock limit reached.");

return;

}

item.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

save();

updateCart();

renderProducts();

alert("Added to cart");

}


function updateCart(){

document.getElementById("cartCount")
.textContent=
cart.reduce((a,b)=>a+b.qty,0);

}


function toggleWish(id){

if(wishlist.includes(id))

wishlist=
wishlist.filter(x=>x!=id);

else

wishlist.push(id);

save();

renderProducts();

}


/* =========================
OPEN CART
========================= */

function openCart(){

document.getElementById("cartModal")
.style.display="block";

let area=
document.getElementById("cartArea");

if(!cart.length){

area.innerHTML=
"<p>Your cart is empty.</p>";

return;

}


let total=0;


area.innerHTML=

cart.map(x=>{

let p=
products.find(y=>y.id==x.id);

if(!p)return"";

let subtotal=
Number(p.price)*Number(x.qty);

total+=subtotal;

return `

<div class="cartrow">

<div>

<b>${escapeHTML(p.name)}</b>

<br>

<span class="small">
₹${p.price} × ${x.qty}
</span>

<br>

<button class="qtybtn"
onclick="changeQty(${p.id},-1)">−</button>

${x.qty}

<button class="qtybtn"
onclick="changeQty(${p.id},1)">+</button>

</div>

<b>₹${subtotal}</b>

</div>

`;

}).join("")

+

`

<h3>Total Order Value: ₹${total}</h3>

<button class="primary"
onclick="checkout()">

Place Order

</button>

`;

}


/* =========================
CHANGE QTY
========================= */

function changeQty(id,change){

let item=cart.find(x=>x.id==id);

let p=products.find(x=>x.id==id);

if(!item||!p)return;

item.qty+=change;

if(item.qty<=0){

cart=cart.filter(x=>x.id!=id);

}

if(item.qty>Number(p.stock)){

item.qty=Number(p.stock);

alert("Stock limit reached.");

}

save();

updateCart();

openCart();

renderProducts();

}


/* =========================
CUSTOMER ACCOUNT
========================= */

function openAccount(){

document.getElementById("accountModal")
.style.display="block";

let profile=
JSON.parse(
localStorage.getItem("customerProfile")||"null"
);

if(profile){

document.getElementById("accountArea").innerHTML=`

<div class="success">
Customer profile saved successfully.
</div>

<p><b>Name:</b> ${escapeHTML(profile.name)}</p>

<p><b>Shop:</b> ${escapeHTML(profile.shop)}</p>

<p><b>Mobile:</b> ${escapeHTML(profile.mobile)}</p>

<p><b>Address:</b> ${escapeHTML(profile.address)}</p>

<p>
<b>GPS:</b>
${profile.lat?profile.lat+", "+profile.lng:"Not available"}
</p>

${
profile.lat
?
`<a
href="https://www.google.com/maps?q=${profile.lat},${profile.lng}"
target="_blank">

<button class="primary">
📍 View My Location
</button>

</a>`
:""
}

<button
class="primary"
onclick="getGPS(true)">

📍 Update GPS Location

</button>

<button
class="primary"
onclick="editCustomerProfile()">

✏️ Edit Profile

</button>

<button
class="primary"
onclick="logoutCustomer()">

Logout

</button>

`;

}else{

showCustomerForm();

}

}


/* =========================
CUSTOMER FORM
========================= */

function showCustomerForm(){

document.getElementById("accountArea").innerHTML=`

<h3>Customer Details</h3>

<p class="small">
Please enter your details once. They will be saved for future orders.
</p>

<input
id="customerName"
placeholder="Customer Name">

<input
id="shopName"
placeholder="Shop Name">

<input
id="customerMobile"
type="tel"
maxlength="10"
placeholder="10 digit Mobile Number">

<textarea
id="customerAddress"
placeholder="Address"></textarea>

<button
class="primary"
onclick="getGPS(false)">

📍 Get GPS Location

</button>

<div id="gpsStatus"
class="small">

GPS location not selected.

</div>

<button
class="primary"
onclick="saveCustomerProfile()">

Save Customer Details

</button>

`;

}


let currentGPS={
lat:"",
lng:""
};


/* =========================
GPS
========================= */

function getGPS(update){

if(!navigator.geolocation){

alert("GPS is not supported by this browser.");

return;

}

let status=
document.getElementById("gpsStatus");

if(status)
status.textContent="Getting GPS location...";


navigator.geolocation.getCurrentPosition(

function(position){

currentGPS.lat=
position.coords.latitude;

currentGPS.lng=
position.coords.longitude;

if(status){

status.textContent=
"GPS Saved: "+
currentGPS.lat.toFixed(6)+
", "+
currentGPS.lng.toFixed(6);

}

if(update){

let profile=
JSON.parse(
localStorage.getItem("customerProfile")||"{}"
);

profile.lat=currentGPS.lat;
profile.lng=currentGPS.lng;

localStorage.setItem(
"customerProfile",
JSON.stringify(profile)
);

alert("GPS location updated.");

openAccount();

}

},

function(error){

if(status)
status.textContent=
"GPS permission not available.";

alert(
"Please allow Location permission in your browser."
);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* =========================
SAVE CUSTOMER
========================= */

function saveCustomerProfile(){

let name=
document.getElementById("customerName")
.value.trim();

let shop=
document.getElementById("shopName")
.value.trim();

let mobile=
document.getElementById("customerMobile")
.value.trim();

let address=
document.getElementById("customerAddress")
.value.trim();


if(!name||!shop||!mobile||!address){

alert("Please fill all details.");

return;

}


if(!/^[6-9]\d{9}$/.test(mobile)){

alert("Enter valid 10 digit mobile number.");

return;

}


let profile={

name:name,
shop:shop,
mobile:mobile,
address:address,
lat:currentGPS.lat,
lng:currentGPS.lng

};


localStorage.setItem(
"customerProfile",
JSON.stringify(profile)
);

alert("Customer profile saved.");

openAccount();

}


/* =========================
EDIT CUSTOMER
========================= */

function editCustomerProfile(){

let p=
JSON.parse(
localStorage.getItem("customerProfile")||"{}"
);

document.getElementById("accountArea").innerHTML=`

<h3>Edit Customer Details</h3>

<input
id="customerName"
value="${escapeAttr(p.name||"")}"
placeholder="Customer Name">

<input
id="shopName"
value="${escapeAttr(p.shop||"")}"
placeholder="Shop Name">

<input
id="customerMobile"
type="tel"
maxlength="10"
value="${escapeAttr(p.mobile||"")}"
placeholder="Mobile Number">

<textarea
id="customerAddress"
placeholder="Address">${escapeHTML(p.address||"")}</textarea>

<div class="small">

GPS:
${p.lat?p.lat+", "+p.lng:"Not available"}

</div>

<button
class="primary"
onclick="getGPS(false)">

📍 Update GPS

</button>

<button
class="primary"
onclick="saveCustomerProfile()">

Save Changes

</button>

`;

}


/* =========================
CHECKOUT
========================= */

function checkout(){

let profile=
JSON.parse(
localStorage.getItem("customerProfile")||"null"
);

if(!profile){

alert(
"Please complete customer profile first."
);

closeModal("cartModal");

openAccount();

return;

}


if(!cart.length){

alert("Cart is empty.");

return;

}


let orderItems=[];

let total=0;


for(let item of cart){

let p=
products.find(x=>x.id==item.id);

if(!p)continue;

let subtotal=
Number(p.price)*Number(item.qty);

total+=subtotal;


orderItems.push({

id:p.id,
name:p.name,
qty:item.qty,
mrp:Number(p.mrp||p.price),
dealPrice:Number(p.price),
subtotal:subtotal

});

}


let order={

id:"ORD"+Date.now(),

customer:{

name:profile.name,
shop:profile.shop,
mobile:profile.mobile,
address:profile.address,
lat:profile.lat||"",
lng:profile.lng||""

},

items:orderItems,

total:total,

status:"Pending",

date:new Date().toLocaleString(),

notified:false

};


orders.push(order);


/* Reduce stock */

orderItems.forEach(item=>{

let p=
products.find(x=>x.id==item.id);

if(p){

p.stock=
Math.max(
0,
Number(p.stock)-Number(item.qty)
);

}

});


cart=[];

save();

updateCart();

renderProducts();

updateOrderBadge();

closeModal("cartModal");


alert(
"Order placed successfully!\n\nOrder ID: "+
order.id
);

}


/* =========================
ADMIN
========================= */

function openAdmin(){

document.getElementById("adminModal")
.style.display="block";

let logged=
localStorage.getItem("adminLogged");

if(logged=="yes")

showAdmin();

else

showAdminLogin();

}


/* =========================
ADMIN LOGIN
========================= */

function showAdminLogin(){

document.getElementById("adminArea")
.innerHTML=`

<h2>Admin Login</h2>

<input
id="adminUser"
placeholder="User ID">

<input
id="adminPass"
type="password"
placeholder="Password">

<button
class="primary"
onclick="adminLogin()">

Login

</button>

<p class="small">
Default: admin / 123456
</p>

`;

}


function adminLogin(){

let u=
localStorage.getItem("adminUser")
||"admin";

let p=
localStorage.getItem("adminPass")
||"123456";


if(

document.getElementById("adminUser")
.value==u

&&

document.getElementById("adminPass")
.value==p

){

localStorage.setItem(
"adminLogged",
"yes"
);

showAdmin();

}else{

alert("Wrong User ID or Password");

}

}


/* =========================
ADMIN PANEL
========================= */

function showAdmin(){

updateOrderBadge();


document.getElementById("adminArea")
.innerHTML=`

<h2>Admin Panel</h2>

<button
class="primary"
onclick="addProduct()">

➕ Add Product

</button>

<button
class="primary"
onclick="manageCategories()">

🏷️ Categories

</button>

<button
class="primary"
onclick="showOrders()">

📦 Orders
<span id="adminOrderCount"></span>

</button>

<button
class="primary"
onclick="manageStock()">

📊 Stock

</button>

<button
class="primary"
onclick="manageBanner()">

🖼️ Banner

</button>

<button
class="primary"
onclick="changeAdmin()">

🔐 Change User ID / Password

</button>

<button
class="primary"
onclick="adminLogout()">

Logout

</button>

<hr>

<h3>Products</h3>

${products.map(p=>`

<div class="adminitem">

<div class="row">

<div>

<b>${escapeHTML(p.name)}</b>

<br>

<span class="small">
${escapeHTML(p.cat)}
</span>

<br>

<span>
MRP ₹${p.mrp||p.price}
&nbsp; | &nbsp;
Deal ₹${p.price}
</span>

<br>

<span class="small">
Stock: ${p.stock}
</span>

</div>

<div>

<button
class="edit"

/* =========================
ADD PRODUCT
========================= */

function addProduct(){

let name=
prompt("Product name?");

if(!name)return;


let cat=
prompt(
"Category?\n\nAvailable: "+
categories
.filter(x=>x!="All")
.join(", ")
);

if(!cat)return;


if(!categories.includes(cat)){

alert(
"Category does not exist.\nPlease create it in Categories first."
);

return;

}


let mrp=
Number(prompt("MRP Price?"));

if(!mrp||mrp<=0){

alert("Enter valid MRP.");

return;

}


let price=
Number(prompt("Deal Price?"));

if(!price||price<=0){

alert("Enter valid Deal Price.");

return;

}


let stock=
Number(prompt("Stock quantity?",20));


let img=
prompt(
"Image URL?\n\nYou can later use Edit to upload a phone image."
);


products.push({

id:Date.now(),

name:name,

cat:cat,

mrp:mrp,

price:price,

stock:stock||0,

img:img||
"https://via.placeholder.com/300"

});


save();

showAdmin();

renderCategories();

renderProducts();

}


/* =========================
EDIT PRODUCT
========================= */

function editProduct(id){

let p=
products.find(x=>x.id==id);

if(!p)return;


let name=
prompt("Product name",p.name);

if(name!==null)
p.name=name;


let mrp=
prompt("MRP Price",p.mrp||p.price);

if(mrp!==null)
p.mrp=Number(mrp);


let price=
prompt("Deal Price",p.price);

if(price!==null)
p.price=Number(price);


let stock=
prompt("Stock",p.stock);

if(stock!==null)
p.stock=Number(stock);


let cat=
prompt(
"Category",
p.cat
);

if(cat!==null){

if(!categories.includes(cat)){

alert(
"Category does not exist. Create it first."
);

}else{

p.cat=cat;

}

}


let upload=
confirm(
"Do you want to select a new image from your phone?"
);

if(upload){

chooseProductImage(id);

}else{

let img=
prompt(
"Image URL",
p.img
);

if(img!==null)
p.img=img;

}


save();

showAdmin();

renderCategories();

renderProducts();

}


/* =========================
PHONE IMAGE UPLOAD
========================= */

function chooseProductImage(id){

let input=
document.createElement("input");

input.type="file";

input.accept="image/*";


input.onchange=function(){

let file=input.files[0];

if(!file)return;


let reader=
new FileReader();


reader.onload=function(e){

let p=
products.find(x=>x.id==id);

if(p){

p.img=e.target.result;

save();

showAdmin();

renderProducts();

alert("Product image updated.");

}

};


reader.readAsDataURL(file);

};


input.click();

}


/* =========================
DELETE PRODUCT
========================= */

function deleteProduct(id){

if(
confirm("Delete this product?")
){

products=
products.filter(
p=>p.id!=id
);

save();

showAdmin();

renderProducts();

}

}


/* =========================
CATEGORIES
========================= */

function manageCategories(){

let current=
categories
.filter(x=>x!="All")
.join(",");


let c=
prompt(
"Enter category names separated by commas",
current
);

if(c===null)return;


let newCats=
c.split(",")
.map(x=>x.trim())
.filter(Boolean);


categories=
["All",...newCats];


if(
selectedCat!="All"
&&
!categories.includes(selectedCat)
){

selectedCat="All";

}


save();

showAdmin();

renderCategories();

renderProducts();

}

function saveStock(id){

document.getElementById(
"stock_"+id
);

products.find(x=>x.id==id);

Math.max(0,Number(input.value));

}

}

/* =========================
ORDER STATUS
========================= */

function changeOrderStatus(id,status){

let order=
orders.find(x=>x.id==id);

if(!order)return;


let oldStatus=
order.status;


order.status=status;

save();


if(
status=="Confirmed"
&&
oldStatus!="Confirmed"
){

alert(
"Order confirmed.\nYou can now send WhatsApp message."
);

}


showOrders();

}


/* =========================
WHATSAPP
========================= */

function sendWhatsApp(id){

let order=
orders.find(x=>x.id==id);

if(!order)return;


let mobile=
order.customer.mobile;


let message=
"Gayatri Enterprises - Dodla Ice Creams%0A%0A"+
"Order Confirmed%0A"+
"Order ID: "+order.id+"%0A"+
"Customer: "+encodeURIComponent(order.customer.name)+"%0A"+
"Shop: "+encodeURIComponent(order.customer.shop)+"%0A%0A";


(order.items||[]).forEach(item=>{

message+=
encodeURIComponent(item.name)+
" x "+
item.qty+
" = ₹"+
item.subtotal+
"%0A";

});


message+=
"%0ATotal: ₹"+
order.total+
"%0A%0A"+
"Thank you for your order.";


window.open(
"https://wa.me/91"+
mobile+
"?text="+message,
"_blank"
);

}

/* =========================
SAFE TEXT
========================= */

function escapeHTML(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return escapeHTML(value);

}


function escapeText(value){

return String(value??"")
.replace(/'/g,"\\'")
.replace(/"/g,"&quot;");

}
