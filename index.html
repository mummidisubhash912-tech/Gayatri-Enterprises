<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gayatri Enterprises - Dodla Ice Creams</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#222}
header{background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0001}
.top{background:#7b1230;color:#fff;padding:14px;text-align:center}
.top b{font-size:20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 15px}
.logo{font-weight:800;color:#7b1230;font-size:18px}
nav button{border:0;background:#fff;font-size:22px;margin-left:8px}
.search{padding:0 15px 12px}
.search input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.hero{background:linear-gradient(135deg,#7b1230,#e39a37);color:white;padding:35px 20px;text-align:center}
.hero h1{margin:0 0 10px;font-size:28px}
.hero p{margin:5px}
section{padding:20px 15px}
h2{margin-top:0}
.cats{display:flex;gap:10px;overflow:auto}
.cats button{white-space:nowrap;border:1px solid #7b1230;background:#fff;color:#7b1230;border-radius:20px;padding:9px 15px}
.cats button.active{background:#7b1230;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:145px;object-fit:contain;border-radius:10px;background:#fafafa}
.card h3{font-size:15px;margin:8px 0 4px}
.price{font-weight:bold;color:#7b1230}
.card button,.primary{width:100%;border:0;background:#7b1230;color:white;padding:10px;border-radius:8px;margin-top:8px}
.small{font-size:12px;color:#777}
footer{background:#222;color:#fff;text-align:center;padding:25px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:20px}
.box{background:white;border-radius:15px;padding:20px;max-width:500px;margin:30px auto;max-height:90vh;overflow:auto}
.box input,.box select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px}
.close{float:right;background:none;border:0;font-size:25px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.adminitem{border-bottom:1px solid #ddd;padding:12px 0}
.adminitem button{border:0;padding:7px;border-radius:6px;margin:2px}
.danger{background:#c62828;color:#fff}
.edit{background:#eee}
.cartrow{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px 0}
.badge{background:#e53935;color:#fff;border-radius:20px;padding:2px 7px;font-size:11px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>

<header>
<div class="top"><b>Gayatri Enterprises</b><br>Dodla Ice Creams • Kakinada</div>
<nav>
<div class="logo">🍦 DODLA</div>
<div>
<button onclick="openCart()">🛒 <span id="cartCount" class="badge">0</span></button>
<button onclick="openAccount()">👤</button>
<button onclick="openAdmin()">⚙️</button>
</div>
</nav>
<div class="search">
<input id="search" placeholder="Search ice creams..." oninput="renderProducts()">
</div>
</header>

<div class="hero">
<h1>Dodla Ice Creams</h1>
<p>Delicious • Quality • Family Packs</p>
<p>Kakinada</p>
</div>

<section>
<h2>Categories</h2>
<div class="cats" id="categories"></div>
</section>

<section>
<div class="row">
<h2>Products</h2>
<span id="productCount" class="small"></span>
</div>
<div id="products" class="products"></div>
</section>

<footer>
<b>Gayatri Enterprises – Dodla Ice Creams</b>
<p>Kakinada, Andhra Pradesh</p>
<p>Contact: 9912527666</p>
</footer>

<!-- ACCOUNT -->
<div class="modal" id="accountModal">
<div class="box">
<button class="close" onclick="closeModal('accountModal')">×</button>
<h2>Customer Account</h2>
<div id="accountArea"></div>
</div>
</div>

<!-- CART -->
<div class="modal" id="cartModal">
<div class="box">
<button class="close" onclick="closeModal('cartModal')">×</button>
<h2>Your Cart</h2>
<div id="cartArea"></div>
</div>
</div>

<!-- ADMIN -->
<div class="modal" id="adminModal">
<div class="box">
<button class="close" onclick="closeModal('adminModal')">×</button>
<div id="adminArea"></div>
</div>
</div>

<script>
const defaultProducts=[
{id:1,name:"Vanilla",cat:"Cups",price:35,img:"https://via.placeholder.com/300?text=Vanilla"},
{id:2,name:"Chocolate",cat:"Cups",price:40,img:"https://via.placeholder.com/300?text=Chocolate"},
{id:3,name:"Strawberry",cat:"Cups",price:40,img:"https://via.placeholder.com/300?text=Strawberry"},
{id:4,name:"Butterscotch",cat:"Cups",price:45,img:"https://via.placeholder.com/300?text=Butterscotch"},
{id:5,name:"Chocobar",cat:"Bars",price:30,img:"https://via.placeholder.com/300?text=Chocobar"},
{id:6,name:"Grape Bar",cat:"Bars",price:30,img:"https://via.placeholder.com/300?text=Grape+Bar"},
{id:7,name:"Mango",cat:"Bars",price:30,img:"https://via.placeholder.com/300?text=Mango"},
{id:8,name:"Family Pack",cat:"Family Packs",price:180,img:"https://via.placeholder.com/300?text=Family+Pack"}
];

let products=JSON.parse(localStorage.getItem("products")||"null")||defaultProducts;
let categories=JSON.parse(localStorage.getItem("categories")||"null")||["All","Cups","Bars","Family Packs"];
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
let wishlist=JSON.parse(localStorage.getItem("wishlist")||"[]");
let selectedCat="All";

function save(){
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("categories",JSON.stringify(categories));
localStorage.setItem("cart",JSON.stringify(cart));
localStorage.setItem("wishlist",JSON.stringify(wishlist));
}

function renderCategories(){
let el=document.getElementById("categories");
el.innerHTML=categories.map(c=>`<button class="${c==selectedCat?'active':''}" onclick="selectCat('${c}')">${c}</button>`).join("");
}

function selectCat(c){selectedCat=c;renderCategories();renderProducts()}

function renderProducts(){
let q=document.getElementById("search").value.toLowerCase();
let list=products.filter(p=>(selectedCat=="All"||p.cat==selectedCat)&&p.name.toLowerCase().includes(q));
document.getElementById("productCount").textContent=list.length+" products";
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}" alt="${p.name}">
<h3>${p.name}</h3>
<div class="small">${p.cat}</div>
<div class="price">₹${p.price}</div>
<button onclick="addCart(${p.id})">Add to Cart</button>
<button style="background:#eee;color:#222" onclick="toggleWish(${p.id})">${wishlist.includes(p.id)?"❤️":"♡"} Wishlist</button>
</div>`).join("");
}

function addCart(id){
let item=cart.find(x=>x.id==id);
if(item)item.qty++;
else cart.push({id,qty:1});
save();updateCart();alert("Added to cart");
}

function updateCart(){
document.getElementById("cartCount").textContent=cart.reduce((a,b)=>a+b.qty,0);
}

function toggleWish(id){
if(wishlist.includes(id))wishlist=wishlist.filter(x=>x!=id);
else wishlist.push(id);
save();renderProducts();
}

function openCart(){
document.getElementById("cartModal").style.display="block";
let area=document.getElementById("cartArea");
if(!cart.length){area.innerHTML="<p>Your cart is empty.</p>";return}
let total=0;
area.innerHTML=cart.map(x=>{
let p=products.find(y=>y.id==x.id);
if(!p)return"";
total+=p.price*x.qty;
return `<div class="cartrow"><span>${p.name} × ${x.qty}</span><b>₹${p.price*x.qty}</b></div>`;
}).join("")+
`<h3>Total: ₹${total}</h3>
<button class="primary" onclick="checkout()">Proceed to Checkout</button>`;
}

function checkout(){
let phone=localStorage.getItem("customerPhone");
if(!phone){
alert("Please login with your mobile number first.");
closeModal("cartModal");openAccount();return;
}
let order={
id:"ORD"+Date.now(),
phone,
items:cart,
date:new Date().toLocaleString()
};
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));
cart=[];save();updateCart();
closeModal("cartModal");
alert("Order placed successfully! Order ID: "+order.id);
}

function openAccount(){
document.getElementById("accountModal").style.display="block";
let phone=localStorage.getItem("customerPhone");
document.getElementById("accountArea").innerHTML=phone?
`<p>Logged in mobile: <b>${phone}</b></p>
<button class="primary" onclick="logoutCustomer()">Logout</button>`:
`<p>Enter your mobile number</p>
<input id="mobile" type="tel" maxlength="10" placeholder="10 digit mobile number">
<button class="primary" onclick="loginCustomer()">Login</button>`;
}

function loginCustomer(){
let n=document.getElementById("mobile").value.trim();
if(!/^[6-9]\d{9}$/.test(n)){alert("Enter a valid 10 digit mobile number");return}
localStorage.setItem("customerPhone",n);
openAccount();
}

function logoutCustomer(){
localStorage.removeItem("customerPhone");openAccount();
}

function openAdmin(){
document.getElementById("adminModal").style.display="block";
let logged=localStorage.getItem("adminLogged");
if(logged=="yes")showAdmin();
else showAdminLogin();
}

function showAdminLogin(){
document.getElementById("adminArea").innerHTML=`
<h2>Admin Login</h2>
<input id="adminUser" placeholder="User ID">
<input id="adminPass" type="password" placeholder="Password">
<button class="primary" onclick="adminLogin()">Login</button>
<p class="small">Default: admin / 123456</p>`;
}

function adminLogin(){
let u=localStorage.getItem("adminUser")||"admin";
let p=localStorage.getItem("adminPass")||"123456";
if(document.getElementById("adminUser").value==u&&document.getElementById("adminPass").value==p){
localStorage.setItem("adminLogged","yes");showAdmin();
}else alert("Wrong User ID or Password");
}

function showAdmin(){
document.getElementById("adminArea").innerHTML=`
<h2>Admin Panel</h2>
<button class="primary" onclick="addProduct()">➕ Add Product</button>
<button class="primary" onclick="manageCategories()">🏷️ Categories</button>
<button class="primary" onclick="changeAdmin()">🔐 Change User ID / Password</button>
<button class="primary" onclick="showOrders()">📦 Orders</button>
<button class="primary" onclick="adminLogout()">Logout</button>
<hr>
<h3>Products</h3>
${products.map(p=>`<div class="adminitem">
<b>${p.name}</b> — ₹${p.price}<br>
<span class="small">${p.cat}</span><br>
<button class="edit" onclick="editProduct(${p.id})">Edit</button>
<button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
</div>`).join("")}`;
}

function addProduct(){
let name=prompt("Product name?");
if(!name)return;
let cat=prompt("Category?");
let price=Number(prompt("Price?"));
let img=prompt("Image URL?");
products.push({id:Date.now(),name,cat,price,img:img||"https://via.placeholder.com/300"});
if(!categories.includes(cat))categories.push(cat);
save();showAdmin();renderCategories();renderProducts();
}

function editProduct(id){
let p=products.find(x=>x.id==id);
let name=prompt("Product name",p.name);
if(name!==null)p.name=name;
let price=prompt("Price",p.price);
if(price!==null)p.price=Number(price);
let cat=prompt("Category",p.cat);
if(cat!==null){p.cat=cat;if(!categories.includes(cat))categories.push(cat)}
let img=prompt("Image URL",p.img);
if(img!==null)p.img=img;
save();showAdmin();renderCategories();renderProducts();
}

function deleteProduct(id){
if(confirm("Delete this product?")){
products=products.filter(p=>p.id!=id);
save();showAdmin();renderProducts();
}
}

function manageCategories(){
let c=prompt("Enter category names separated by commas",categories.filter(x=>x!="All").join(","));
if(c!==null){
categories=["All",...c.split(",").map(x=>x.trim()).filter(Boolean)];
save();showAdmin();renderCategories();
}
}

function changeAdmin(){
let u=prompt("New User ID",localStorage.getItem("adminUser")||"admin");
if(!u)return;
let p=prompt("New Password");
if(!p)return;
localStorage.setItem("adminUser",u);
localStorage.setItem("adminPass",p);
alert("Admin login changed.");
showAdmin();
}

function showOrders(){
let orders=JSON.parse(localStorage.getItem("orders")||"[]");
document.getElementById("adminArea").innerHTML=
`<button onclick="showAdmin()">← Back</button><h2>Orders</h2>`+
(orders.length?orders.map(o=>`<div class="adminitem">
<b>${o.id}</b><br>Mobile: ${o.phone}<br>${o.date}
</div>`).join(""):"<p>No orders yet.</p>");
}

function adminLogout(){
localStorage.removeItem("adminLogged");showAdminLogin();
}

function closeModal(id){document.getElementById(id).style.display="none"}

renderCategories();renderProducts();updateCart();
</script>
</body>
</html>
